slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /odometry/filtered

    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.3
    transform_timeout: 0.5
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000

    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08

    # Reduce search window so matcher can't jump far
    correlation_search_space_dimension: 0.3    # default 0.5 — smaller search area
    correlation_search_space_resolution: 0.01  # default 0.01
    fine_search_angle_offset: 0.003

    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    
    minimum_laser_range: 0.1   # add this line — match the X3 Pro's minimum range