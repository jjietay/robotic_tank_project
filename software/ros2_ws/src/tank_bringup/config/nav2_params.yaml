# ==========================================================================
#  Nav2 parameters — Autonomous Tank
#
#  Robot: tracked differential drive, can spin in place
#  Footprint: ~31cm long × ~18cm wide (MEASURE AND ADJUST)
#  Max speed: 0.14 m/s (measured max wheel speed at full PWM)
# ==========================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    # -- Particle filter --
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2          # rotation noise from rotation (tracked = high)
    alpha2: 0.2          # rotation noise from translation
    alpha3: 0.2          # translation noise from translation
    alpha4: 0.2          # translation noise from rotation
    alpha5: 0.2          # translation noise (omnidirectional — irrelevant for diff drive)
    # -- Laser model --
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.2
    # -- Update thresholds --
    update_min_a: 0.2    # radians of rotation before particle update
    update_min_d: 0.1    # metres of translation before particle update
    resample_interval: 1
    # -- Frames --
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5
    # -- Motion model (required for diff-drive) --
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # -- Recovery --
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # Explicit paths to Nav2 behavior trees (empty string caused "Empty Tree" error)
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # Full plugin list from official Nav2 Humble nav2_params.yaml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    transform_tolerance: 5.0     # CRITICAL: allow stale goal timestamps during recovery cycles (fixes TF extrapolation error on slow RPi4)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5           # goal tolerance in metres
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    odom_topic: /odometry/filtered
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.4
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # -- Velocity limits (match your tank) --
      min_vel_x: -0.05          # allow slight reverse
      max_vel_x: 0.12           # below your 0.14 hard max
      min_vel_y: 0.0            # diff-drive: no lateral
      max_vel_y: 0.0
      max_vel_theta: 0.7
      min_speed_xy: 0.0
      max_speed_xy: 0.12
      min_speed_theta: 0.0

      # -- Acceleration (moderate, won't overshoot) --
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.6
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.6

      # -- Velocity samples (the "dynamic window") --
      vx_samples: 20
      vy_samples: 1             # diff-drive: only 1
      vtheta_samples: 40        # plenty of rotation options to steer around obstacles
      sim_time: 1.5             # how far ahead each trajectory is simulated
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5

      # -- Diff-drive kinematics --
      # (no holonomic motion — vy locked to 0 above)

      # -- Critics (the scoring functions that produce avoidance) --
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

      # critic weights
      BaseObstacle.scale: 0.12        # obstacle avoidance strength — raise to avoid harder
      PathAlign.scale: 16.0           # stay aligned with global path
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 24.0            # stay close to the path
      GoalDist.scale: 24.0            # make progress toward goal
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 1.0
      Oscillation.oscillation_reset_dist: 0.05

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.14, 0.0, 1.0]
    min_velocity: [-0.14, 0.0, -1.0]
    deadband_velocity: [0.04, 0.0, 0.1]
    velocity_timeout: 1.0
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1

# ==========================================================================
#  Costmaps
# ==========================================================================

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_footprint: "[[0.155, 0.09], [0.155, -0.09], [-0.155, -0.09], [-0.155, 0.09]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0    # moderate falloff — allows straighter paths
        inflation_radius: 0.35      
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_footprint: "[[0.155, 0.09], [0.155, -0.09], [-0.155, -0.09], [-0.155, 0.09]]"
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0    # was 3.0 — wider berth for the replan experiment
        inflation_radius: 0.35      # was 0.12 — visibly wider arc
