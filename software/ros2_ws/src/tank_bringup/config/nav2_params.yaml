# ==========================================================================
#  Nav2 parameters — Autonomous Tank
#
#  Robot: tracked differential drive, can spin in place
#  Footprint: ~20cm long × ~18cm wide (MEASURE AND ADJUST)
#  Max speed: 0.14 m/s (measured max wheel speed at full PWM)
# ==========================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    # -- Particle filter --
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2          # rotation noise from rotation (tracked = high)
    alpha2: 0.2          # rotation noise from translation
    alpha3: 0.2          # translation noise from translation
    alpha4: 0.2          # translation noise from rotation
    alpha5: 0.2          # translation noise (omnidirectional — irrelevant for diff drive)
    # -- Laser model --
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.2
    # -- Update thresholds --
    update_min_a: 0.2    # radians of rotation before particle update
    update_min_d: 0.1    # metres of translation before particle update
    resample_interval: 1
    # -- Frames --
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5
    # -- Motion model (required for diff-drive) --
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # -- Recovery --
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    set_initial_pose: false    # you'll set initial pose in RViz manually

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # Use the default Nav2 behavior trees (empty string = built-in default)
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5           # goal tolerance in metres
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0       # 10 Hz is plenty for 0.14 m/s
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller/SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 20.0    # generous — tank is slow

    goal_checker:
      plugin: "nav2_controller/SimpleGoalChecker"
      xy_goal_tolerance: 0.15          # 15 cm — good enough for a first run
      yaw_goal_tolerance: 0.4           # ~23 degrees — don't obsess over final heading
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller/RegulatedPurePursuitController"
      # -- Speed limits --
      desired_linear_vel: 0.12           # cruise speed (slightly under max 0.14)
      lookahead_dist: 0.3                # how far ahead on the path to aim
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.6
      lookahead_time: 1.5                # lookahead = max(min_lookahead, vel * lookahead_time)
      rotate_to_heading_angular_vel: 0.5 # rad/s for in-place rotation
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.03 # slow crawl near goal
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # -- Regulated speeds near obstacles & curves --
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.03
      # -- Rotation behavior --
      allow_reversing: false
      max_angular_accel: 0.8
      rotate_to_heading_min_angle: 0.5   # ~29 deg — only rotate in place if error > this
      max_robot_pose_search_dist: 1.5

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# ==========================================================================
#  Costmaps
# ==========================================================================
# IMPORTANT: Measure your tank's footprint (length × width) and update
# the robot_footprint below. Current estimate: 20cm × 18cm.

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Rectangular footprint: [[front-left], [front-right], [back-right], [back-left]]
      # MEASURE YOUR TANK and update these values (metres from base_link centre)
      robot_footprint: "[[0.10, 0.09], [0.10, -0.09], [-0.10, -0.09], [-0.10, 0.09]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d/ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d/InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30      # 30 cm clearance — conservative

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Rectangular footprint — same as local costmap
      robot_footprint: "[[0.10, 0.09], [0.10, -0.09], [-0.10, -0.09], [-0.10, 0.09]]"
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d/StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d/ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d/InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30